services:
  - name: african-wildlife-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

  # Combined API + Streamlit UI in one container/service (simplest option:
  # one URL, no cross-service env var to wire up). Streamlit talks to the
  # API over localhost inside the same container.
  - name: african-wildlife-app
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.combined
    healthCheckPath: /
